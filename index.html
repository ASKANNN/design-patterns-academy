<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Premium educational platform for learning Gang of Four Design Patterns."/>
  <meta name="theme-color" content="#6366F1"/>
  <style>
    html {
      color-scheme: light
    }

    html, body {
      background-color: #F8F8FC
    }

    [data-theme="dark"] {
      color-scheme: dark
    }

    [data-theme="dark"], [data-theme="dark"] body {
      background-color: #0A0C10
    }

    #app {
      opacity: 0;
      transition: opacity .22s ease
    }

    .skip-link {
      position: fixed;
      top: 0;
      left: 0;
      transform: translateY(-200%)
    }
  </style>
  <script>(function () {
    var t = localStorage.getItem('dpa-theme');
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
  })()</script>

  <link rel="canonical" href="https://askan-de-pa-ac.vercel.app/"/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Design Patterns Academy"/>

  <meta property="og:title" content="Design Patterns Academy"/>
